name: Publish container image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version to publish (for example, 1.0.0)
        required: false
        type: string
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Build the commit Release validated. The main branch can move while
          # that workflow is still running, and checking it out drops the image.
          ref: >-
            ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha ||
            (inputs.version != '' && format('v{0}', inputs.version) || github.ref) }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The checked-out commit, not github.sha: on workflow_run that is main's
      # tip. semantic-release tags the commit it released (vX.Y.Z).
      - name: Read commit and release version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION_INPUT:-$(git tag --points-at HEAD --list 'v*' | head -n1 | sed 's/^v//')}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=true
          tags: |
            type=raw,value=sha-${{ steps.version.outputs.sha }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
