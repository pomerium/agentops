# The in-cluster agent reaches the sandbox route through the Pomerium Service
# and trusts the mkcert root.
apiVersion: batch/v1
kind: Job
metadata:
  name: agent-tests
  namespace: sandbox-egress
spec:
  template:
    spec:
      hostAliases:
        - ip: POMERIUM_PROXY_IP
          hostnames: [sandbox.localhost.pomerium.io]
      containers:
        - name: tests
          env:
            - name: SANDBOX_API_URL
              value: https://sandbox.localhost.pomerium.io
            - name: POMERIUM_CA_CERT
              value: /etc/pomerium-ca/ca.crt
          volumeMounts:
            - {name: pomerium-ca, mountPath: /etc/pomerium-ca, readOnly: true}
      volumes:
        - name: pomerium-ca
          secret:
            secretName: pomerium-ca
