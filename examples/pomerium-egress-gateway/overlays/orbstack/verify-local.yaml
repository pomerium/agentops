# verify validates Pomerium's assertion against the JWKS of the route's host.
# In this cluster that host resolves to 127.0.0.1, so point it at the Pomerium
# Service and trust the mkcert root.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verify
  namespace: sandbox-egress
spec:
  template:
    spec:
      hostAliases:
        - ip: POMERIUM_PROXY_IP
          hostnames: [verify.localhost.pomerium.io]
      containers:
        - name: verify
          env:
            - name: EXTRA_CA_CERTS
              value: /etc/pomerium-ca/ca.crt
          volumeMounts:
            - {name: pomerium-ca, mountPath: /etc/pomerium-ca, readOnly: true}
      volumes:
        - name: pomerium-ca
          secret:
            secretName: pomerium-ca
