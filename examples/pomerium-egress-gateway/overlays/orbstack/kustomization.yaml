apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# What is particular to the OrbStack cluster that the agentops quickstart
# installed: Pomerium lives in `agentops-pomerium` with the IngressClass
# `pomerium-agentops`, the hosts are under localhost.pomerium.io, and Pomerium
# presents a mkcert certificate, so every client needs the mkcert root CA.
# `make deploy` creates the `pomerium-ca` Secret and fills in
# POMERIUM_PROXY_IP.

resources:
  - ../../sandbox
  - ../../router
  - ../../agent
  - routes-quickstart.yaml

images:
  - name: python-egress-sandbox
    newTag: dev

patches:
  - path: pomerium-namespace.yaml
    target:
      kind: SandboxTemplate
  - target:
      kind: NetworkPolicy
      name: agentops-egress-only
    patch: |-
      - op: replace
        path: /spec/egress/1/to/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: agentops-pomerium
  # The base routes sit next to their Services, where a controller that
  # watches every namespace finds them. This controller does not, so drop
  # them and add routes-quickstart.yaml instead.
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: sandbox
        namespace: agent-sandbox-system
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: verify
        namespace: sandbox-egress
  - path: sidecar-ca.yaml
    target:
      kind: SandboxTemplate
  - path: verify-local.yaml
  - path: agent-local.yaml
