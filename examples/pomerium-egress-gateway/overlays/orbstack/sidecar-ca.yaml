# Pomerium's mkcert certificate: the sidecar verifies the routes against it.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: python-egress
spec:
  podTemplate:
    spec:
      initContainers:
        - name: sidecar
          env:
            - {name: SIDECAR_WORKLOAD_CA_FILE, value: /etc/pomerium-ca/ca.crt}
          volumeMounts:
            - {name: pomerium-ca, mountPath: /etc/pomerium-ca, readOnly: true}
      volumes:
        - name: pomerium-ca
          secret:
            secretName: pomerium-ca
