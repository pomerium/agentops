[project]
name = "pomerium-sandbox-example"
version = "0.1.0"
description = "Agent frameworks driving a Kubernetes agent-sandbox whose egress goes through Pomerium."
requires-python = ">=3.11,<3.14"
dependencies = [
    "k8s-agent-sandbox[async]>=1.0.6,<2",
    "requests>=2.32",
]

# One extra per framework. They disagree about the `openai` package (the
# OpenAI Agents SDK wants openai 3, litellm and others want 2), so uv treats
# them as mutually exclusive: `uv run --extra adk ...` builds an environment
# with that one framework, which is how an application installs one anyway.
[project.optional-dependencies]
deepagents = [
    "deepagents>=0.7.10,<0.8",
    "deepagents-k8s-agent-sandbox",
    "langchain-anthropic>=1.7",
]
openai = [
    "openai-agents-k8s-sandbox",
]
smolagents = ["smolagents[litellm]>=1.26"]
adk = ["google-adk>=2.11"]
pydantic-ai = ["pydantic-ai-slim[anthropic]>=2.55", "anyio>=4"]
test = ["pytest>=9", "pytest-timeout>=2.4"]

[tool.uv]
conflicts = [
    [
        { extra = "deepagents" },
        { extra = "openai" },
        { extra = "smolagents" },
        { extra = "adk" },
        { extra = "pydantic-ai" },
    ],
]

[tool.uv.sources]
deepagents-k8s-agent-sandbox = { git = "https://github.com/kubernetes-sigs/agent-sandbox.git", subdirectory = "clients/integrations/deepagents" }
openai-agents-k8s-sandbox = { git = "https://github.com/kubernetes-sigs/agent-sandbox.git", subdirectory = "clients/integrations/openai" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pomerium_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
