name: Stack top
permissions:
  contents: read
on:
  workflow_call:
    outputs:
      top:
        description: "'true' when the calling run should do its work"
        value: ${{ jobs.gate.outputs.top }}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      top: ${{ steps.check.outputs.top }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Look for pull requests stacked on this one
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: .github/scripts/stack-top.sh
