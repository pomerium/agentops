name: Test
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  stack:
    uses: ./.github/workflows/stack-top.yaml
    permissions:
      contents: read
      pull-requests: read

  test:
    needs: stack
    if: needs.stack.outputs.top == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: .tool-versions
          cache-dependency-path: "**/go.sum"

      - name: Stack gate tests
        run: .github/scripts/stack-top_test.sh

      - name: Vet
        run: make vet

      - name: Boundary
        run: make boundary

      - name: Telemetry copies in sync
        run: make telemetry-in-sync

      - name: Protobuf code in sync
        run: make proto-check

      - name: Build
        run: make build

      - name: Test
        run: make test

  sdk:
    needs: stack
    if: needs.stack.outputs.top == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: .tool-versions
          cache-dependency-path: "**/go.sum"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: SDK protobuf code in sync
        run: make sdk-generate-check

      - name: TypeScript conformance
        run: make sdk-test-ts

      - name: Python conformance
        run: make sdk-test-py
