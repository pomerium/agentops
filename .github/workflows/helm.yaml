name: Helm
permissions:
  contents: read
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "deploy/charts/**"
  release:
    types:
      - published

env:
  OCI_REGISTRY: registry-1.docker.io
  OCI_REPO: oci://registry-1.docker.io/pomerium

jobs:
  stack:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/stack-top.yaml
    permissions:
      contents: read
      pull-requests: read

  test:
    needs: stack
    if: needs.stack.outputs.top == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Helm CLI
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Lint
        run: make helm-lint

      - name: Template
        run: make helm-template > /dev/null

      - name: Template without persistence
        run: make helm-template HELM_EXTRA_VALUES="--set persistence.enabled=false" > /dev/null

      - name: Slack bot isolation
        run: make helm-check-client-isolation

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart:
          - agentops
          - agentops-slackbot
    env:
      CHART_DIR: ./deploy/charts/${{ matrix.chart }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Helm CLI
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Set version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "release" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            APP_VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="0.0.0-git-${GITHUB_SHA::7}"
            APP_VERSION="git-${GITHUB_SHA::8}"
          fi
          sed -i "s/^version:.*/version: ${VERSION}/" "${CHART_DIR}/Chart.yaml"
          sed -i "s/^appVersion:.*/appVersion: ${APP_VERSION}/" "${CHART_DIR}/Chart.yaml"

      - name: Login
        run: |
          helm registry login "${OCI_REGISTRY}" \
            --username "${{ secrets.DOCKERHUB_USER }}" \
            --password "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Package
        run: helm package "${CHART_DIR}" --destination ./out

      - name: Push
        run: |
          set -euo pipefail
          for chart in ./out/*.tgz; do
            helm push "${chart}" "${OCI_REPO}"
          done
