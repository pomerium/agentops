# Code generation for the sidecar protocol in proto/. Plugins run via `go tool` so
# their versions are pinned by go.mod, matching the controller-gen/sqlc convention.
#
# The client-facing Harness API (proto/harnessapi) is generated by the harness
# module (harness/buf.gen.connect.yaml): it speaks Connect, not gRPC, and belongs
# to that module rather than this one.
version: v2
plugins:
  - local: [go, tool, protoc-gen-go]
    out: .
    opt: module=github.com/pomerium/agentops
  - local: [go, tool, protoc-gen-go-grpc]
    out: .
    opt: module=github.com/pomerium/agentops
inputs:
  - directory: proto
    paths:
      - proto/sidecar
