version: v2
plugins:
  - local: [go, tool, protoc-gen-go]
    out: .
    opt: module=github.com/pomerium/agentops/harness
  - local: [go, tool, protoc-gen-go-grpc]
    out: .
    opt: module=github.com/pomerium/agentops/harness
inputs:
  - directory: ../proto
    paths:
      - ../proto/agentlink
      - ../proto/runner
