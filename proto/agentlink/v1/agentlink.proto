syntax = "proto3";

package agentlink.v1;

option go_package = "github.com/pomerium/agentops/harness/internal/agentlink/pb;agentlinkpb";

// AgentLinkService is served by the agentops manager and dialed BY the
// sandbox sidecar through a Pomerium route (bearer: agentic run token). The
// sidecar is the gRPC client for every RPC; the manager drives the sandbox by
// sending directives on streams the sidecar opened (role inversion — the
// GitLab agentk pattern). Identity is NEVER taken from message fields: the
// manager derives run_id and the pod identity from the
// X-Pomerium-Jwt-Assertion header and treats any mismatching Hello as an
// attack.
service AgentLinkService {
  // Attach is the control stream: exactly one live Attach per run. Carries
  // liveness (heartbeats, status) and lifecycle directives. Reopened by the
  // sidecar with backoff after any drop.
  rpc Attach(stream SidecarFrame) returns (stream ManagerFrame);

  // AgentIO carries the ACP byte stream between the manager and the agent
  // process's stdio. Opened by the sidecar after SpawnAgent, reopened after a
  // drop with resume. At most one live AgentIO per run.
  rpc AgentIO(stream AgentIOFrame) returns (stream AgentIOFrame);
}

message SidecarFrame {
  oneof msg {
    SidecarHello hello = 1; // first frame, exactly once per stream
    Status status = 2; // state transitions + periodic heartbeat
    AgentExited exited = 3; // the runner reported the agent process exit
  }
}

message ManagerFrame {
  oneof msg {
    ManagerHelloAck hello_ack = 1; // first frame, exactly once per stream
    SpawnAgent spawn = 2; // start $ACP_AGENT_CMD via the runner
    Shutdown shutdown = 3; // terminal: kill agent, stop envoy, exit 0
    Heartbeat heartbeat = 4; // manager liveness (see heartbeat rules)
  }
}

message Heartbeat {}

message SidecarHello {
  uint32 protocol_version = 1; // version 1 is the only one defined
  // Attempt counts attaches for this pod boot (1 = first). Logging/metrics
  // only. run_id/pod identity are deliberately ABSENT: the assertion is the
  // sole identity source.
  uint32 attempt = 2;
  bool agent_running = 3; // true on re-attach if the agent survived the drop
}

message ManagerHelloAck {
  uint32 protocol_version = 1;
  // Heartbeat contract: the sidecar sends Status at least every interval; the
  // manager declares the link dead after miss_limit consecutive missed
  // intervals.
  uint32 heartbeat_seconds = 2; // default 20
  uint32 heartbeat_miss_limit = 3; // default 3
  // The per-session configuration the sidecar cannot be born with. A warm-pool
  // pod is created before any claim exists, so anything that varies per session
  // has to arrive here; see SandboxConfig.
  SandboxConfig config = 4;
}

// SandboxConfig is what the manager knows and the pod does not: the endpoints
// this session's agent reaches its upstreams through. It rides HelloAck because
// the sidecar needs it before envoy can serve anything, and the sidecar applies
// it exactly once — a re-attach re-sends it, and envoy is already running by
// then.
//
// Endpoints the pod IS born with (the LLM route, say) stay in the pod's own env:
// they are the same for every session the SandboxTemplate serves. The two sets
// are unioned, and a name in both is a configuration error the sidecar refuses.
message SandboxConfig {
  repeated ProxiedEndpoint endpoints = 1;
}

// ProxiedEndpoint is one loopback listener that the sidecar's envoy serves to
// the agent. Envoy forwards each request to upstream_url and injects the
// agentic run token. The agent never sees a credential.
message ProxiedEndpoint {
  string name = 1;
  uint32 listen_port = 2;
  string upstream_url = 3;
  // Overrides the host:port envoy dials while SNI and Host stay derived from
  // upstream_url. For a public hostname that does not resolve in-cluster.
  string dial_address = 4;
}

message Status {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_STARTING = 1; // envoy launching
    STATE_READY = 2; // envoy listeners serving; also the heartbeat state
    STATE_ERROR = 3; // terminal on the sidecar side; reason is set
  }
  State state = 1;
  // Machine-readable on STATE_ERROR (envoy_exited, runner_unreachable,
  // token_terminal:<reason>, agentio_buffer_overflow, …).
  string reason = 2;
}

message AgentExited {
  int32 exit_code = 1;
}

message SpawnAgent {}

message Shutdown {
  string reason = 1;
}

// AgentIOFrame framing is symmetric in both directions: byte-exact and
// resumable. Each side numbers the payload bytes it sends with a cumulative
// offset ("seq" = offset of the LAST byte in this frame, 1-based) and
// acknowledges the peer's offsets. Senders keep a replay buffer of unacked
// bytes (bounded; overflow is terminal). On (re)open, each side's Open frame
// declares the highest peer offset it has durably consumed; the peer replays
// everything after that. Frames carry at most 64 KiB of payload.
message AgentIOFrame {
  oneof msg {
    AgentIOOpen open = 1; // first frame from each side, exactly once
    AgentIOData data = 2;
    AgentIOAck ack = 3;
  }
}

message AgentIOOpen {
  uint64 consumed = 1; // resume point: replay my peer's bytes from consumed+1
}

message AgentIOData {
  uint64 seq = 1; // offset of the last payload byte
  bytes payload = 2;
}

message AgentIOAck {
  uint64 consumed = 1; // cumulative; sent at least every 512 KiB or 500 ms
}
