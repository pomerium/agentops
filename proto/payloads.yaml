# The Harness API's event payload SHAPES: the JSON body carried by each event
# type named in vocabulary.yaml.
#
# This file is the SOURCE of all of them. `make generate` renders it into the Go
# api package, both SDKs and the payload table in docs/clients.md — see
# harness/cmd/vocabgen. Edit here, never there.
#
# It sits next to the .proto for the same reason vocabulary.yaml does, and for
# the opposite half of the reason. The proto describes the ENVELOPE, whose
# payload field is `bytes` on purpose: the log promises byte-identical replay,
# and an unknown payload has to survive a client that has never heard of it. So
# the shapes cannot be proto messages — but they are still one contract with four
# audiences, and the emit side is the one that decides what the bytes say.
#
# Which is why the GO STRUCTS ARE GENERATED FROM HERE TOO, rather than checked
# against this afterwards. The harness marshals these types with encoding/json,
# so the file below does not describe the wire — it IS the wire, and no test has
# to be trusted to notice a drift that cannot happen.
#
# The wire conventions the renderers are pinned to, all of them today's:
#
#   - keys are snake_case, exactly as written here;
#   - `optional` is Go's `omitempty` — the key is absent when the value is zero.
#     A timestamp cannot be optional, because encoding/json ignores omitempty on
#     a struct and would write the zero time while three languages called the
#     key absent;
#   - a `duration` is a NUMERIC count of NANOSECONDS, and its key ends in _ns,
#     because that is what Go's time.Duration marshals to. Not milliseconds, not
#     a quoted string;
#   - an `int` is a JSON number, never a quoted one.
#
# WHICH event carries which payload is not restated here: vocabulary.yaml's
# event types already say, and one of the two would eventually be wrong. A shape
# no event names is a nested one (PermissionOption), and a shape nothing names at
# all is rejected as dead.
#
# A payload is a name, a doc and its fields in wire order. A field is a JSON key
# (`name`), a `type` — one of the scalars string · bool · int · float · duration
# · timestamp · json, or a vocabulary from vocabulary.yaml, or another payload,
# or []Payload for a repeated one — and `optional`.
#
# Both docs are rendered in every language, so both are written for all of them:
# a payload's as prose starting with its name, which is shared; a field's as the
# lowercase phrase that follows the field's name, the convention vocabulary.yaml
# already uses. [Name] in either is a cross-reference, rendered in the form each
# language links with. Prose that names a field names the WIRE key, which is the
# one spelling every audience can act on.

payloads:
  - name: StateChanged
    doc: StateChanged is a session-state transition.
    fields:
      - name: old
        type: SessionState
        doc: the state the session left.
      - name: new
        type: SessionState
        doc: the state the session is now in; the same value a GetSession would report.
      - name: reason
        type: Reason
        optional: true
        doc: one of the [Reason] values, empty for an ordinary transition.

  - name: ApprovalRequired
    doc: |
      ApprovalRequired is the consent page a human has to visit before the run
      may start.

      The URL is platform-authoritative: a client renders it as chrome the agent
      cannot imitate, never as agent-supplied content.
    fields:
      - name: approval_url
        type: string
        doc: the consent page to deliver to the approver. Opening it lets the person
          who follows it approve this run, so hand it only to that person, and
          render it as chrome rather than as anything the agent said.
      - name: expires_at
        type: timestamp
        doc: when the approval window closes. A timestamp is always written, so
          an absent expiry reads as the zero time rather than as a missing key.

  - name: Approved
    doc: Approved is the verified identity that let the run start.
    fields:
      - name: approver_subject
        type: string
        doc: the raw IdP subject reported by the authorization server —
          email/name enrichment is a directory concern and deliberately not an
          AS field.

  - name: LaunchStalled
    doc: |
      LaunchStalled is an approved run whose workspace should have dialed in
      seconds later, and has not.

      It is on the log rather than only in the platform's own trace because it is
      the one launch observation a reader can act on, and without it the session
      sits on "waiting for approval" long after the approval — which reads as
      "nobody clicked" and sends every diagnosis to the wrong subsystem. The
      session is not lost when this arrives: the approval window is still open
      and the sandbox keeps retrying, so it reports rather than concludes.
    fields:
      - name: waited_ns
        type: duration
        doc: how long the approved run has gone without its workspace connecting back.

  - name: AgentMessage
    doc: |
      AgentMessage is one complete segment of the agent's visible output.

      A segment, not a chunk. The platform buffers ACP message chunks and emits a
      segment when a tool call interrupts it (final false) or when the turn ends
      (final true) — the same granularity the Slack renderer has always
      displayed, and the granularity that keeps the durable log from carrying one
      row per token. part_id addresses the segment, so a client updates a
      rendered part in place instead of diffing text.

      text is attacker-influenceable by construction (prompt injection). The
      platform carries it verbatim and never sanitizes it; rendering it as inert
      content — no link unfurling, no mention syntax — is the client's half of
      the contract.
    fields:
      - name: part_id
        type: string
        doc: addresses this segment within the turn. A later agent_message with the
          same part_id replaces the text of the one before, so a client updates the
          rendered part in place.
      - name: text
        type: string
        doc: the segment's text, verbatim from the agent. Untrusted; render it as inert
          content.
      - name: final
        type: bool
        doc: true on the turn's last segment, false on one a tool call interrupted.

  - name: AgentThought
    doc: AgentThought is the agent's reasoning, when it discloses any.
    fields:
      - name: text
        type: string
        doc: the reasoning, verbatim from the agent. Untrusted, like agent text.

  - name: ToolCall
    doc: |
      ToolCall announces a tool call or updates one already announced.

      Today's Slack UX (segment flush, busy indicator) is driven entirely by
      these, which is why they are on the log rather than only in the application
      trace.
    fields:
      - name: id
        type: string
        doc: identifies the call within the session; an update carries the id of the
          call it updates, and a permission_request names it as tool_call_id.
      - name: title
        type: string
        optional: true
        doc: a short human-readable name for the call, as the agent gives it.
      - name: kind
        type: string
        optional: true
        doc: what sort of tool it is (read, edit, execute, fetch, …), passed through
          from the agent's protocol unchanged.
      - name: status
        type: ToolCallStatus
        doc: where the call is, one of the [ToolCallStatus] values.
      - name: invocation_message
        type: string
        optional: true
        doc: the agent's own description of what it is doing, when it supplies
          one.
      - name: tool_input
        type: json
        optional: true
        doc: the raw tool input as the agent sent it, when the agent discloses
          it. Untrusted, like agent text.
      - name: update
        type: bool
        optional: true
        doc: false when this announces a new call, true for a status or result
          update to one already announced.

  - name: PermissionOption
    doc: PermissionOption is one choice on a permission request.
    fields:
      - name: id
        type: string
        doc: the option's id, which RespondPermission takes as option_id.
      - name: name
        type: string
        doc: the option's label, as the agent offers it, for the person choosing.
      - name: kind
        type: string
        optional: true
        doc: what choosing it means (allow_once, allow_always, reject_once,
          reject_always, …), passed through from the agent's protocol unchanged.

  - name: PermissionRequest
    doc: |
      PermissionRequest asks the client's principal to authorize a tool call. The
      agent is blocked until RespondPermission answers it or the deadline passes.
    fields:
      - name: request_id
        type: string
        doc: identifies the request; RespondPermission takes it, and the
          permission_resolved event that closes it carries it.
      - name: summary
        type: string
        doc: what the agent is asking to do, in its own words, for the person deciding.
          Untrusted, like agent text.
      - name: options
        type: "[]PermissionOption"
        doc: the choices on offer. Answer with one of their ids.
      - name: deadline
        type: timestamp
        doc: when the request lapses unanswered; the agent is then told no, and a
          permission_resolved event records it as expired.
      - name: tool_call_id
        type: string
        optional: true
        doc: the call the request belongs to.

  - name: PermissionResolved
    doc: |
      PermissionResolved closes a permission request, however it ended.

      It closes the loop after a reconnect too: a client that missed the answer
      learns it from here rather than leaving buttons live forever.
    fields:
      - name: request_id
        type: string
        doc: the request this closes, as permission_request named it.
      - name: resolution
        type: Resolution
        doc: the chosen option id, or one of the [Resolution] values.

  - name: TurnCompleted
    doc: TurnCompleted is a turn that finished.
    fields:
      - name: stop_reason
        type: string
        doc: the ACP stop reason ("end_turn", "max_tokens", "cancelled", …).

  - name: TurnFailed
    doc: |
      TurnFailed is a turn that died. "Why did this turn die" is a first-class
      answer, not something to reconstruct from logs.
    fields:
      - name: reason
        type: string
        doc: why the turn died, as a human-readable explanation for a person or a log.

  - name: Usage
    doc: |
      Usage is the turn's token and cost counters, as the agent reports them.
      Chargeback is the second question every platform team asks, so these are on
      the log from day one.
    fields:
      - name: input_tokens
        type: int
        optional: true
        doc: prompt tokens the turn consumed.
      - name: output_tokens
        type: int
        optional: true
        doc: tokens the agent generated.
      - name: cached_input_tokens
        type: int
        optional: true
        doc: prompt tokens served from the model's cache.
      - name: cache_creation_tokens
        type: int
        optional: true
        doc: prompt tokens written to the model's cache.
      - name: thought_tokens
        type: int
        optional: true
        doc: tokens spent on reasoning, when the model reports them separately.
      - name: total_tokens
        type: int
        optional: true
        doc: all tokens the turn used, as the agent counts them.
      - name: cost_usd
        type: float
        optional: true
        doc: what the turn cost, in US dollars, as the agent reports it.
      - name: context_window
        type: int
        optional: true
        doc: how much context the agent has, when it says.
      - name: context_used
        type: int
        optional: true
        doc: how much of it this turn left occupied, when it says.

  - name: IdleWarning
    doc: IdleWarning is a quiet session, to be suspended in lead_ns unless
      something happens.
    fields:
      - name: lead_ns
        type: duration
        doc: how long until the session is suspended; a Prompt before then keeps it
          running.

  - name: Suspended
    doc: Suspended is a session whose pod is gone. The workspace and the
      conversation are not.
    fields:
      - name: reason
        type: Reason
        optional: true
        doc: one of the [Reason] values.
      - name: retained_for_ns
        type: duration
        optional: true
        doc: how long the workspace is kept before it is released.

  - name: Revived
    doc: Revived is a suspended session come back — same workspace, same
      conversation, new pod, new run, and a fresh human approval.

  - name: Released
    doc: Released is a suspended session whose retention window lapsed and whose
      workspace was reclaimed.
    fields:
      - name: retained_for_ns
        type: duration
        optional: true
        doc: how long the workspace was kept.

  - name: SessionEnded
    doc: SessionEnded is the last event a session ever emits.
    fields:
      - name: reason
        type: EndReason
        doc: one of the [EndReason] values.
      - name: detail
        type: string
        optional: true
        doc: a human-readable elaboration, empty when the reason says it all. It
          is for a person reading a log, never for a client to branch on — that
          is what reason is for.
