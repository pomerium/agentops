{{- include "slackbot.validateValues" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "slackbot.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slackbot.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "slackbot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "slackbot.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/channels: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.slack.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "slackbot.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: slackbot
          image: {{ include "slackbot.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/slackbot"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "slackbot.secretName" . }}
                  key: SLACK_SIGNING_SECRET
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "slackbot.secretName" . }}
                  key: SLACK_BOT_TOKEN
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: HTTP_ADDR
              value: ":8080"
            {{- with .Values.slack.streamInterval }}
            - name: AGENT_STREAM_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            - name: SLACK_CHANNEL_MAP
              value: "/etc/agentops/channels.yaml"
            - name: HARNESS_API_URL
              value: {{ .Values.harnessAPI.url | quote }}
            - name: HARNESS_API_TOKEN_FILE
              value: "/var/run/harness-api/token"
            {{- with .Values.harnessAPI.dialAddress }}
            - name: HARNESS_API_DIAL_ADDRESS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.harnessAPI.caFile }}
            - name: HARNESS_API_CA_FILE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: channels
              mountPath: /etc/agentops
              readOnly: true
            - name: harness-api-token
              mountPath: /var/run/harness-api
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      volumes:
        - name: channels
          configMap:
            name: {{ include "slackbot.fullname" . }}-channels
        - name: harness-api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.harnessAPI.tokenAudience | quote }}
                  expirationSeconds: {{ int .Values.harnessAPI.tokenExpirationSeconds }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
