{{- include "agentops.validateValues" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agentops.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "agentops.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentops.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentops.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "agentops.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "agentops.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/harness"]
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
            - name: api
              containerPort: {{ .Values.service.apiPort }}
              protocol: TCP
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DB_PATH
              value: "/data/agentops.db"
            - name: SESSION_TTL
              value: {{ .Values.config.sessionTTL | quote }}
            - name: SESSION_IDLE_TTL
              value: {{ .Values.config.sessionIdleTTL | quote }}
            - name: SESSION_IDLE_WARN_LEAD
              value: {{ .Values.config.sessionIdleWarnLead | quote }}
            - name: SUSPENDED_TTL
              value: {{ .Values.config.suspendedTTL | quote }}
            - name: SANDBOX_LEASE
              value: {{ .Values.config.sandboxLease | quote }}
            - name: AGENTIC_AS_URL
              value: {{ .Values.config.agentic.asURL | quote }}
            - name: AGENTIC_TOKEN_FILE
              value: "/var/run/agentic/token"
            - name: AGENTIC_RUN_TTL
              value: {{ .Values.config.agentic.runTTL | quote }}
            {{- with .Values.config.agentic.dialAddress }}
            - name: AGENTIC_AS_DIAL_ADDRESS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.agentic.caFile }}
            - name: AGENTIC_CA_FILE
              value: {{ . | quote }}
            {{- end }}
            - name: HARNESS_GRPC_ADDR
              value: ":{{ .Values.service.grpcPort }}"
            - name: HARNESS_EXTERNAL_URL
              value: {{ .Values.config.harness.externalURL | quote }}
            - name: HARNESS_ASSERTION_ISSUER
              value: {{ .Values.config.harness.assertionIssuer | quote }}
            - name: HARNESS_ATTACH_GRACE
              value: {{ .Values.config.harness.attachGrace | quote }}
            - name: HARNESS_ATTACH_WARN_AFTER
              value: {{ .Values.config.harness.attachWarnAfter | quote }}
            - name: HARNESS_HEARTBEAT_INTERVAL
              value: {{ .Values.config.harness.heartbeatInterval | quote }}
            - name: HARNESS_HEARTBEAT_MISS_LIMIT
              value: {{ .Values.config.harness.heartbeatMissLimit | quote }}
            - name: HARNESS_API_ADDR
              value: ":{{ .Values.service.apiPort }}"
            - name: HARNESS_ADMIN_ADDR
              value: ":{{ .Values.service.adminPort }}"
            - name: HARNESS_API_ASSERTION_ISSUER
              value: {{ .Values.config.harness.api.assertionIssuer | quote }}
            {{- with .Values.config.harness.api.assertionAudience }}
            - name: HARNESS_API_ASSERTION_AUDIENCE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: agentic-token
              mountPath: /var/run/agentic
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      volumes:
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        - name: agentic-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.config.agentic.audience | quote }}
                  expirationSeconds: {{ int .Values.config.agentic.tokenExpirationSeconds }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "agentops.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- range .Values.persistence.accessModes }}
          - {{ . }}
          {{- end }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
