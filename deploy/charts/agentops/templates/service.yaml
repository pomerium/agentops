apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentops.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "agentops.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      protocol: TCP
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
    - name: api
      protocol: TCP
      port: {{ .Values.service.apiPort }}
      targetPort: api
