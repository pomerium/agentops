{{- if .Values.installCRDs }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
    controller-gen.kubebuilder.io/version: v0.21.0
  name: agenttemplates.agents.pomerium.com
spec:
  group: agents.pomerium.com
  names:
    kind: AgentTemplate
    listKind: AgentTemplateList
    plural: agenttemplates
    shortNames:
    - agt
    singular: agenttemplate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.warmPoolRef.name
      name: WarmPool
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentTemplate is the declarative definition of an agent that clients of the
          Harness API can run.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentTemplateSpec defines the desired configuration of a workflow.

              A workflow runs when a client asks for it by metadata.name. Which Slack
              channel asks for which template is the Slack bot's own configuration and is
              deliberately not a cluster resource.
            properties:
              requiredMCPServers:
                description: |-
                  RequiredMCPServers lists the MCP servers that must be connected for the
                  invoking user before the workflow can run. They are disclosed to the
                  approver on Pomerium's consent page, with a Connect link for any the
                  approver has not yet authorized.

                  This is not what the run token is allowed to reach. Nothing here grants
                  access: each Pomerium route decides for itself whether it accepts a run
                  token and which runs its policy admits.
                items:
                  description: |-
                    MCPServerRef is an MCP server the agent uses. The platform lists its URL in
                    the run that the person approves. The sandbox sidecar serves it to the agent
                    on a loopback port and adds the run token to each request.
                  properties:
                    dialAddress:
                      description: |-
                        DialAddress optionally overrides the host[:port] the sandbox sidecar
                        connects to for this server, while TLS SNI and the Host header still come
                        from URL. Use it to reach an in-cluster Service
                        (e.g. "pomerium-proxy.pomerium.svc.cluster.local:443") instead of
                        hairpinning through an external LoadBalancer VIP. Empty dials the
                        host:port parsed from URL.
                      type: string
                    name:
                      description: |-
                        Name identifies the server and must be unique within the AgentTemplate.
                        The agent sees the server under this name.
                      type: string
                    url:
                      description: |-
                        URL is the streamable-HTTP endpoint of the MCP server: a Pomerium route
                        that accepts the run token.
                      type: string
                  required:
                  - name
                  - url
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              sessionConfig:
                additionalProperties:
                  type: string
                description: |-
                  SessionConfig sets agent-advertised ACP session configuration options
                  (session/set_config_option) after the session is created, keyed by
                  option id. The value is the option's value id for select options (e.g.
                  model: opus, effort: high on the Claude Code harness) or "true"/"false"
                  for boolean options. Strict: if the harness does not advertise a
                  configured option id, or rejects the value, the session fails to
                  launch — a session running with silently unapplied config would be
                  misleading.
                type: object
              systemPrompt:
                description: |-
                  SystemPrompt is the system prompt provided to the agent for this
                  workflow.
                type: string
              warmPoolRef:
                description: |-
                  WarmPoolRef selects the agent-sandbox SandboxWarmPool that runs this
                  agent. The pool references a SandboxTemplate, which defines the harness
                  image, the sidecar, and, when the agent needs a repository checked out,
                  the git working context on the template's git-init init container. A pool
                  whose template checks out a repository belongs to one agent. The platform
                  creates one SandboxClaim against this pool per session. The claim carries
                  no session data, so it can adopt a pre-warmed pod from the pool.
                properties:
                  name:
                    description: Name of the SandboxWarmPool (in the same namespace).
                    type: string
                required:
                - name
                type: object
            required:
            - warmPoolRef
            type: object
          status:
            description: AgentTemplateStatus is the observed state of an AgentTemplate.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
    controller-gen.kubebuilder.io/version: v0.21.0
  name: clientbindings.agents.pomerium.com
spec:
  group: agents.pomerium.com
  names:
    kind: ClientBinding
    listKind: ClientBindingList
    plural: clientbindings
    shortNames:
    - clibind
    singular: clientbinding
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.subject
      name: Subject
      type: string
    - jsonPath: .spec.templates
      name: Templates
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClientBinding registers a client of the Harness API: which verified identity
          it is, and which agent templates it may run.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ClientBindingSpec registers one client of the Harness API and says what it may
              do.

              It is the platform team's artifact, not a client's: a client cannot create,
              widen or read its own binding. Who a client IS is a Pomerium decision (the
              route's identity_providers plus its policy); what a client MAY DO is this.
            properties:
              quotas:
                description: |-
                  Quotas bound what a client can spend. The platform checks them each time
                  the client creates or continues a session. Unset means no limit.
                properties:
                  createRatePerMinute:
                    description: |-
                      CreateRatePerMinute caps how many sessions a client may start per minute.
                      A new session and the continuation of a suspended one both count, and a
                      client may spend a whole minute's allowance at once. Each start asks a
                      human for approval, so an uncapped client is a spam primitive as much as a
                      cost one.
                    format: int32
                    minimum: 0
                    type: integer
                  maxLiveSessions:
                    description: MaxLiveSessions caps sessions in any non-terminal
                      state.
                    format: int32
                    minimum: 0
                    type: integer
                  maxPendingApprovals:
                    description: |-
                      MaxPendingApprovals caps sessions waiting for a human to approve. Pending is
                      the expensive state and is capped separately: a never-approved session holds
                      a warm pod for the whole approval window, so the two limits answer different
                      questions.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              subject:
                description: |-
                  Subject is the verified caller identity this binding applies to: the
                  subject of the assertion Pomerium stamps on the client API route. A client
                  cannot state its own.

                  Pomerium mints it as "<identity provider>/<sub>", so for a projected
                  ServiceAccount token verified by a provider named "cluster" it reads
                  "cluster/system:serviceaccount:agentops-slackbot:agentops-slackbot".

                  Note this is NOT the string the route's own PPL policy matches. That one
                  is evaluated against the raw sub of the presented token and carries no
                  prefix; this is the sub of the assertion Pomerium MINTS, which does. The
                  two are easy to swap and fail in opposite directions — a wrong policy is a
                  403 the client reports, a wrong binding is a binding that never applies.

                  Take the exact value from the harness's log rather than from this comment:
                  the prefix is a property of the deployment's provider name, and the harness
                  prints each client once, at Info, the first time it sees one ("admitted a
                  client on the harness API"). A binding whose subject does not match is a
                  binding that never applies.
                type: string
              templates:
                description: |-
                  Templates is the allow-list of AgentTemplate names this client may run.
                  Empty means the binding grants no templates. A client with no
                  ClientBinding is refused every call.
                items:
                  type: string
                type: array
            required:
            - subject
            type: object
          status:
            description: ClientBindingStatus is the observed state of a ClientBinding.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
