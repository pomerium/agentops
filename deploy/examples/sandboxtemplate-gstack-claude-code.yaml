apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: gstack-claude-code
  labels:
    app.kubernetes.io/name: agentops
  annotations:
    agents.pomerium.com/inject: "true"
spec:
  podTemplate:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      initContainers:
        - name: git-init
          image: agentops/harness:overlay-must-set
          imagePullPolicy: IfNotPresent
          command: ["git-checkout"]
          env:
            - name: GIT_REPO_URL
              value: "https://github.com/garrytan/gstack.git"
            - name: GIT_REPO_REF
              value: "main"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: agent
          image: agentops/harness:overlay-must-set
          imagePullPolicy: IfNotPresent
          env:
            - name: ACP_AGENT_CMD
              value: "agent-entrypoint"
            - name: CLAUDE_CONFIG_DIR
              value: "/workspace/.agentops/claude"
            - name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
              value: "1"
          volumeMounts:
            - name: workspace
              mountPath: /workspace

  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
