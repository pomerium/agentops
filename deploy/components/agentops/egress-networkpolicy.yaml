apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentops-egress-only
spec:
  podSelector:
    matchLabels:
      agents.pomerium.com/egress: workload
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pomerium
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pomerium
      ports:
        - protocol: TCP
          port: 8443
